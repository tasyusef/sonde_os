[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm build"

[build.nixpacks]
aptPkgs = []

[deploy]
# Cron entry point — runs once per schedule trigger and exits.
# Schedule (every 6h) is set in the Railway dashboard, NOT here.
#
# NODE_OPTIONS="--conditions react-server" is REQUIRED — same reason
# as the holder cron: src/lib/smart-money-scorer.ts imports
# "server-only" which throws at module load without this flag.
#
# `restartPolicyType = "NEVER"` so a successful exit doesn't get
# auto-restarted by Railway as if the cron run had crashed.
startCommand = "NODE_OPTIONS='--conditions react-server' pnpm exec tsx scripts/run-smart-money-scorer.ts"
restartPolicyType = "NEVER"
