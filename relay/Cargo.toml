[package]
name = "sonde-relay"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The Durable Object only builds for Workers; the pure modules test natively.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8.7"
# The `durable_object` macro expands to code that names this crate directly.
wasm-bindgen = "0.2.129"
futures-util = "0.3"
futures-channel = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
